# Weekly run of the full pipeline against the live Eurostat API, to detect upstream changes
# early (renamed or discontinued datasets, new codes, flags or gaps), like the switch from
# prc_hicp_manr to prc_hicp_minr. Fails if the extract or an error-severity quality check fails.
name: Scheduled pipeline

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Runners are pinned (ubuntu-latest moves to Ubuntu 26 from 2026-10-19); bump deliberately.

defaults:
  run:
    shell: bash # explicit bash adds -o pipefail, so `make ... | tee` keeps make's exit code

jobs:
  pipeline:
    name: Full pipeline and quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        # Docker Official Image via the AWS ECR Public mirror: same image, not subject to
        # Docker Hub outages or anonymous pull limits.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: eu_dashboard
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: eu_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eu_dashboard -d eu_dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: eu_dashboard
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_DB: eu_dashboard
      POWERBI_READER_PASSWORD: ci_only_reader_password

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (Python 3.12 and the exact versions in uv.lock)
        run: make install

      - name: Pipeline (extract -> warehouse -> transform -> analytics -> quality)
        run: make pipeline 2>&1 | tee pipeline.log

      - name: Quality checks
        if: always()
        run: make quality 2>&1 | tee quality.log

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-logs
          path: "*.log"
          retention-days: 30
