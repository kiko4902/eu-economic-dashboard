name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: make install PYTHON=python

      - name: Lint
        run: make lint

      - name: Unit tests (database tests are skipped, no database in this job)
        run: make test

  pipeline:
    name: Pipeline, database tests and quality checks
    needs: lint-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eu_dashboard
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: eu_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eu_dashboard -d eu_dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway credentials for the service container above; no secrets needed.
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: eu_dashboard
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_DB: eu_dashboard
      POWERBI_READER_PASSWORD: ci_only_reader_password
      REQUIRE_DB: "1" # database tests must run here: fail instead of skip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: make install PYTHON=python

      - name: Pipeline against the live Eurostat API (ends with quality checks)
        run: make pipeline

      - name: Tests including database tests
        run: make test

      - name: Quality checks
        run: make quality
